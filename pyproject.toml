[tool.black]
line-length = 120
target-version = ["py311"]
# migrations are auto-generated; the rest are local-only dirs (not in CI checkout)
extend-exclude = '''
/(
    migrations
  | node_modules
  | mlruns
  | mlruns_backup_[0-9]+
  | artifacts
  | staticfiles
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip_glob = [
    "*/migrations/*",
    "*/node_modules/*",
    "*/mlruns/*",
    "*/mlruns_backup_*/*",
    "*/artifacts/*",
    "*/staticfiles/*",
]
