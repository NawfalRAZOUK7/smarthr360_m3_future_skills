name: CI

# This service had no CI on main: the workflows lived only on the `develop`
# branch, which had drifted 113 commits behind. Tests and migrations here are
# run on the runner directly rather than through the service image, because
# that image carries a heavy ML stack and building it is what exhausts runner
# disk.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  # config("SECRET_KEY") is the only setting with no default. Test settings
  # want at least 32 bytes of entropy.
  SECRET_KEY: ci-only-not-for-runtime-at-least-32-bytes

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements/requirements-all.txt ruff
      - name: Lint (ruff)
        # Report-only for now: this service accumulated 101 pre-existing ruff
        # errors (mostly unused variables in ml/tests and scripts) while it had
        # no CI. Failing the build on them would keep the test suite from ever
        # running, which is the thing actually worth gating on. Clean these up
        # and drop continue-on-error.
        continue-on-error: true
        run: ruff check .
      - name: Tests
        # Coverage thresholds are configured per-job upstream; this run cares
        # about pass/fail, so coverage is disabled rather than left targetless.
        run: pytest --no-cov

  migrate-seed:
    # Proves migration 0017 and the demo seeder actually apply against
    # Postgres, which is what the service runs on. Both were added without
    # ever being executed anywhere.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        # Throwaway credentials for a service container that exists only for
        # the life of this job and is never reachable outside the runner.
        env:
          POSTGRES_USER: smarthr
          POSTGRES_PASSWORD: smarthr
          POSTGRES_DB: future_skills
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://smarthr:smarthr@localhost:5432/future_skills
      DJANGO_SETTINGS_MODULE: config.settings.compose
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements/requirements-all.txt
      - name: Migrate
        run: python manage.py migrate --noinput
      - name: Seed demo data
        run: python manage.py seed_demo
      - name: Seed again (must be idempotent)
        run: python manage.py seed_demo

  docker:
    # Builds each architecture on its own native runner and then stitches the
    # two into one manifest. Emulating arm64 here is not viable: the ML stack
    # (llvmlite, numba, scikit-learn) took ~20 minutes to build natively, and
    # under QEMU that becomes hours. arm64 runners are free for public repos.
    needs: [lint-test, migrate-seed]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # The ML stack does not fit alongside the runner's preinstalled
        # toolchains; reclaiming them buys roughly 20 GB.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the image name
        # github.repository keeps the owner's original casing, but registry
        # refs must be lowercase. metadata-action normalises this for us; the
        # raw outputs: field below does not.
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.img.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          # The digest is "sha256:<hex>", and the upload-artifact action
          # rejects colons in filenames. Store the bare hex and put the
          # prefix back when the manifest is assembled.
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    # Publishes the tags that deployments actually reference, pointing at both
    # per-architecture digests.
    needs: docker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the image name
        # github.repository keeps the owner's original casing, but registry
        # refs must be lowercase. metadata-action normalises this for us; the
        # raw outputs: field below does not.
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.img.outputs.name }}@sha256:%s ' *)
      - name: Show what was published
        run: docker buildx imagetools inspect ${{ steps.img.outputs.name }}:${{ steps.meta.outputs.version }}
